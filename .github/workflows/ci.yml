name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-public.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run package:roku
      - uses: actions/upload-artifact@v4
        with:
          name: AOA_TV-roku
          path: dist/AOA_TV.zip
